<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Details Form - VVIT</title>
  <link rel="stylesheet" href="style.css?v=4.0">
  <style>
    @page {
      size: A4 portrait;
      margin: 6mm 10mm;
    }
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .app-header,
      .form-header,
      header,
      #authCard,
      #welcomeBanner,
      #formCard,
      .screen-notice,
      .preview-actions,
      #submissionStatus,
      .alert-box,
      .btn {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .main-container, .card, .a4-document {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        box-shadow: none !important;
        background: transparent !important;
      }
      .top-composite-grid {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: flex-start !important;
        gap: 10px !important;
      }
      .id-card-display-wrapper {
        width: 110px !important;
        flex-shrink: 0 !important;
        display: block !important;
      }
      .composite-card-img {
        width: 105px !important;
        height: 135px !important;
        border: 1.2px solid #000000 !important;
        page-break-inside: avoid !important;
      }
      .doc-table td, .doc-table th {
        font-size: 7.8pt !important;
        padding: 2.2px 4px !important;
        line-height: 1.2 !important;
      }
      .doc-sec-heading {
        font-size: 8.5pt !important;
        margin: 6px 0 2px 0 !important;
        padding-bottom: 1px !important;
      }
      .univ-title {
        font-size: 11.5pt !important;
      }
      .doc-subtitle {
        font-size: 9pt !important;
      }
      .declaration-text {
        font-size: 7.2pt !important;
        margin-top: 6px !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <header class="app-header" style="background-color: transparent; border: none; padding: 0 0 16px 0;">
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #1e3a8a; text-align: center; text-transform: uppercase;">
        Vasireddy Venkatadri International Technological University
      </h2>
      <h3 style="font-size: 1.1rem; font-weight: 600; color: #334155; text-align: center; margin-top: 6px;">
        Student Details Form
      </h3>
    </header>

    <!-- ================= STAGE 1: VERIFICATION CARD ================= -->
    <div id="authCard" class="card auth-card-container">
      <div class="auth-stack">
        <div class="form-group">
          <label for="authRegdNo">Regd. Number <span class="required">*</span></label>
          <input type="text" id="authRegdNo" 
                 placeholder="Enter your 14 digit Regd No." 
                 maxlength="14" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="authAdmNo">Admission Number <span class="required">*</span></label>
          <input type="text" id="authAdmNo" 
                 placeholder="Enter your 10 digit Admission No. It starts with letters VCO/VON/VOF" 
                 maxlength="10" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="authSection">Section <span class="required">*</span></label>
          <select id="authSection" required>
            <option value="">Select Section</option>
            <option value="CIV-1">CIV-1</option>
            <option value="CIV-2">CIV-2</option>
            <option value="CSE-1">CSE-1</option>
            <option value="CSE-2">CSE-2</option>
            <option value="ECE-1">ECE-1</option>
            <option value="ECE-2">ECE-2</option>
          </select>
        </div>
      </div>

      <div id="authAlert" class="alert-box danger" style="display: none; margin-top: 14px;"></div>

      <div class="form-actions" style="margin-top: 24px; text-align: center;">
        <button type="button" id="authBtn" class="btn btn-primary" onclick="handleAuthVerification()">Verify & Proceed</button>
      </div>
    </div>

    <!-- ================= STAGE 2: MAIN REGISTRATION FORM ================= -->
    <div id="formCard" class="card" style="display: none;">
      
      <div id="welcomeBanner" class="welcome-box" style="display: none; margin-bottom: 20px;">
        <span id="welcomeNameText"></span>
      </div>

      <form id="studentRegistrationForm" onsubmit="return false;">
        
        <!-- SECTION 1: ACADEMIC DETAILS -->
        <fieldset class="form-section" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 18px; margin-bottom: 20px;">
          <legend style="color: #1e3a8a; font-weight: 700; padding: 0 6px;">1. Academic Identification</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldEnrollmentNo">Regd. Number</label>
              <input type="text" id="fieldEnrollmentNo" readonly class="readonly-input">
            </div>

            <div class="form-group">
              <label for="fieldAdmissionNo">Admission Number</label>
              <input type="text" id="fieldAdmissionNo" readonly class="readonly-input">
            </div>

            <div class="form-group">
              <label for="fieldProgramme">Programme Admitted</label>
              <input type="text" id="fieldProgramme" value="B.Tech" readonly class="readonly-input">
            </div>

            <div class="form-group">
              <label for="fieldSection">Section</label>
              <input type="text" id="fieldSection" readonly class="readonly-input">
            </div>

            <div class="form-group">
              <label for="fieldAdmissionType">Admission Type <span class="required">*</span></label>
              <select id="fieldAdmissionType" onchange="handleAdmissionTypeChange()" required>
                <option value="">Select Admission Type</option>
                <option value="Convenor (EAPCET)">Convenor (EAPCET)</option>
                <option value="Management">Management</option>
                <option value="NRI">NRI</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldRankHtNo">EAPCET Hallticket No <span id="htReqStar" class="required" style="display: none;">*</span></label>
              <input type="text" id="fieldRankHtNo" placeholder="EAPCET Hallticket No" disabled class="readonly-input">
              <span id="err_fieldRankHtNo" class="field-error"></span>
            </div>

            <div class="form-group">
              <label for="fieldFeeReimb">Fee Reimbursement <span class="required">*</span></label>
              <select id="fieldFeeReimb" required>
                <option value="">Select Fee Reimbursement</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldApaarId">APAAR ID</label>
              <input type="text" id="fieldApaarId" placeholder="12-digit APAAR ID">
            </div>
          </div>
        </fieldset>

        <!-- SECTION 2: PERSONAL INFORMATION -->
        <fieldset class="form-section" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 18px; margin-bottom: 20px;">
          <legend style="color: #1e3a8a; font-weight: 700; padding: 0 6px;">2. Personal Information</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldNameSsc">Full Name (as per SSC/CBSE/ICSE) <span class="required">*</span></label>
              <input type="text" id="fieldNameSsc" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
              <label for="fieldGender">Gender <span class="required">*</span></label>
              <select id="fieldGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label>Date of Birth <span class="required">*</span></label>
              <div class="dob-select-group">
                <select id="dobDay" required>
                  <option value="">Day</option>
                </select>
                <select id="dobMonth" required>
                  <option value="">Month</option>
                  <option value="01">Jan</option>
                  <option value="02">Feb</option>
                  <option value="03">Mar</option>
                  <option value="04">Apr</option>
                  <option value="05">May</option>
                  <option value="06">Jun</option>
                  <option value="07">Jul</option>
                  <option value="08">Aug</option>
                  <option value="09">Sep</option>
                  <option value="10">Oct</option>
                  <option value="11">Nov</option>
                  <option value="12">Dec</option>
                </select>
                <select id="dobYear" required>
                  <option value="">Year</option>
                </select>
              </div>
              <input type="hidden" id="fieldDob">
              <span id="err_dob" class="field-error"></span>
            </div>

            <div class="form-group">
              <label for="fieldBloodGroup">Blood Group <span class="required">*</span></label>
              <select id="fieldBloodGroup" required>
                <option value="">Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldCategory">Category <span class="required">*</span></label>
              <select id="fieldCategory" required>
                <option value="">Select Category</option>
                <option value="OC">OC</option>
                <option value="BC-A">BC-A</option>
                <option value="BC-B">BC-B</option>
                <option value="BC-C">BC-C</option>
                <option value="BC-D">BC-D</option>
                <option value="BC-E">BC-E</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
              </select>
            </div>

            <div class="form-group">
              <label for="fieldCaste">Sub-Caste <span class="required">*</span></label>
              <input type="text" id="fieldCaste" placeholder="e.g. Kapu, Reddy, Kamma, Mala, etc." required>
            </div>

            <div class="form-group">
              <label for="fieldStudentMobile">Student Mobile (10-digit) <span class="required">*</span></label>
              <input type="tel" id="fieldStudentMobile" maxlength="10" placeholder="10-digit mobile" required>
              <span id="err_fieldStudentMobile" class="field-error"></span>
            </div>

            <div class="form-group">
              <label for="fieldStudentEmail">Student Email <span class="required">*</span></label>
              <input type="email" id="fieldStudentEmail" placeholder="student@example.com" required>
            </div>

            <div class="form-group">
              <label for="fieldStudentAadhaar">Student Aadhaar (12-digit) <span class="required">*</span></label>
              <input type="text" id="fieldStudentAadhaar" maxlength="12" placeholder="12-digit Aadhaar number" required>
              <span id="err_fieldStudentAadhaar" class="field-error"></span>
            </div>

            <div class="form-group">
              <label for="fieldIdMark1">Identification Mark 1 <span class="required">*</span></label>
              <input type="text" id="fieldIdMark1" required>
            </div>

            <div class="form-group">
              <label for="fieldIdMark2">Identification Mark 2 <span class="required">*</span></label>
              <input type="text" id="fieldIdMark2" required>
            </div>
          </div>
        </fieldset>

        <!-- SECTION 3: EDUCATIONAL QUALIFICATIONS -->
        <fieldset class="form-section" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 18px; margin-bottom: 20px;">
          <legend style="color: #1e3a8a; font-weight: 700; padding: 0 6px;">3. Educational Qualifications</legend>
          <div class="form-grid">
            <div class="form-group">
              <label for="fieldSscRegd">SSC/CBSE/ICSE Regd. Number <span class="required">*</span></label>
              <input type="text" id="fieldSscRegd" required>
            </div>

            <div class="form-group">
              <label for="fieldSscMarks">SSC/CBSE/ICSE Marks Obtained <span class="required">*</span></label>
              <input type="text" inputmode="numeric" id="fieldSscMarks" placeholder="" required>
            </div>

            <div class="form-group">
              <label for="fieldSscPercent">SSC/CBSE/ICSE Percentage <span class="required">*</span></label>
              <input type="number" step="
